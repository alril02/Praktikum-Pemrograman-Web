# Konfigurasi Nginx untuk VPS: SPA statis + reverse proxy API.
# Letakkan di /etc/nginx/sites-available/toko lalu aktifkan; ganti toko.contoh.id dengan domain Anda.
# Sertifikat: sudo certbot --nginx -d toko.contoh.id   (otomatis memperbarui)

# Batas laju permintaan per IP untuk API (zona 10 MB, 20 req/detik)
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# Pengalihan HTTP -> HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name toko.contoh.id;

  # Tantangan ACME untuk Let's Encrypt
  location /.well-known/acme-challenge/ { root /var/www/certbot; }

  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name toko.contoh.id;

  ssl_certificate     /etc/letsencrypt/live/toko.contoh.id/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/toko.contoh.id/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;

  # Header keamanan (HSTS hanya setelah HTTPS terbukti berfungsi)
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  client_max_body_size 3m;                          # sedikit di atas batas unggahan aplikasi (2 MB)

  # Frontend (hasil `npm run build`)
  root /var/www/toko/dist;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;               # fallback SPA
    add_header Cache-Control "no-cache";            # HTML selalu divalidasi
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";   # berkas ber-hash
  }

  # API (Node.js di 127.0.0.1:3000)
  location /api/ {
    limit_req zone=api burst=40 nodelay;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  # Berkas unggahan (disajikan aplikasi; cache panjang karena nama UUID)
  location /uploads/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
  }
}
